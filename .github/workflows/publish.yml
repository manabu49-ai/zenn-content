name: Publish articles to Qiita

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  publish_articles:
    runs-on: ubuntu-latest
    permissions:
      # qiita-cli は投稿後に id / updated_at を書き戻すため、書き込み権限が要る
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: increments/qiita-cli/actions/publish@v1
        with:
          qiita-token: ${{ secrets.QIITA_TOKEN }}
          root: "."
